<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BOXD Tracking - Harsidhi</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --primary: #2563eb; --primary-soft: #eff6ff; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body { background: var(--bg); display:flex; justify-content:center; }
    .viewport { width:100%; max-width:440px; min-height:100vh; background:var(--card); padding:20px; }
    .header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .back-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); }
    .inp { width:100%; padding:14px; border-radius:12px; border:1.5px solid var(--border); font-size:14px; font-weight:600; margin-bottom:12px; }
    .btn { width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); color:#fff; font-weight:700; cursor:pointer; }
    .track-card { background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:20px; display:none; }
  </style>
</head>
<body>
<div class="viewport">
  <div class="header">
    <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i></a>
    <h2 style="font-size:18px; font-weight:800;">BOXD Logistics Track</h2>
  </div>

  <input type="text" id="boxd-awb" class="inp" placeholder="Enter BOXD AWB Number..." />
  <button class="btn" onclick="trackBoxd()">Fetch Live Tracking</button>

  <div id="track-details" class="track-card"></div>
</div>

<script>
  lucide.createIcons();
  const API_URL = localStorage.getItem("GS_API_URL") || "";

  async function trackBoxd() {
    const awb = document.getElementById("boxd-awb").value.trim();
    if(!awb || !API_URL) return;
    const card = document.getElementById("track-details");
    card.style.display = "block";
    card.innerHTML = "Fetching BOXD API...";

    const res = await fetch(`${API_URL}?action=trackShipment&awb=${encodeURIComponent(awb)}`);
    const d = await res.json();
    if(d.success) {
      card.innerHTML = `
        <div style="font-weight:800; font-size:15px; color:var(--primary); margin-bottom:8px;">AWB: ${d.awb}</div>
        <div style="font-size:13px; margin-bottom:4px;"><b>Status:</b> ${d.status || 'In Transit'}</div>
        <div style="font-size:13px; margin-bottom:4px;"><b>Courier:</b> ${d.courierName || 'BOXD'}</div>
        <div style="font-size:13px; margin-bottom:4px;"><b>Order ID:</b> ${d.orderId || '-'}</div>
        <div style="font-size:13px; margin-bottom:4px;"><b>Current City:</b> ${d.city || '-'}</div>
        <div style="font-size:12px; color:#64748b; margin-top:8px;">Expected: ${d.expectedDate || 'N/A'}</div>
      `;
    } else {
      card.innerHTML = `<div style="color:#ef4444; font-weight:600;">Tracking not found on BOXD / Delhivery</div>`;
    }
  }
</script>
</body>
</html>
