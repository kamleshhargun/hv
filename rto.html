<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Return Reconciliation (RTO) - Harsidhi ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f4f6fb; --card-bg: rgba(255, 255, 255, 0.92); --card-border: #e8ecf4; --text: #1e293b; --muted: #64748b; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .app-box { max-width: 1540px; margin: 0 auto; background: var(--card-bg); border-radius: 20px; border: 1.5px solid var(--card-border); padding: 22px; box-shadow: 0 10px 25px rgba(100,116,139,0.08); }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 1.5px solid var(--card-border); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .brand { font-size: 21px; font-weight: 800; color: #1e1b4b; }
    .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav-btn { background: #1e1b4b; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 700; }
    .table-viewport { overflow-x: auto; background: #ffffff; border-radius: 16px; border: 1.5px solid var(--card-border); margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    th { background: #f8fafc; color: #475569; padding: 12px 14px; font-size: 11px; font-weight: 800; text-transform: uppercase; border-bottom: 1.5px solid var(--card-border); }
    td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; color: var(--text); }
    .rto-badge { background: #fee2e2; color: #b91c1c; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 11px; }
  </style>
</head>
<body>
<div class="app-box">
  <div class="header">
    <div class="brand">🔄 Return Reconciliation (RTO)</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">Dashboard</a>
      <a href="order.html" class="nav-btn">Order Recon</a>
      <a href="rto.html" class="nav-btn" style="background:#3b82f6;">Return Recon</a>
      <a href="payment.html" class="nav-btn">Payment Recon</a>
    </div>
  </div>
  <p style="color:var(--muted); font-size:13px;">Track returned shipments, RTO deliveries, and warehouse inward logs[cite: 2].</p>
  
  <div class="table-viewport">
    <table>
      <thead>
        <tr>
          <th>AWB Number</th>
          <th>Order Number</th>
          <th>Customer</th>
          <th>Reason</th>
          <th>RTO Status</th>
        </tr>
      </thead>
      <tbody id="rtoTableBody">
        <tr><td colspan="5" style="text-align:center; padding:20px; color:var(--muted);">Loading RTO logs...[cite: 3]</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzwsETqGw3qosnU2ag1MzUhVJbYusgL9LZAWhaSBOvyf_gr6U28laqQ09HMe02pZXuy/exec";

  async function loadRtoData() {
    try {
      const res = await fetch(API_ENDPOINT + "?action=fetchStation").then(r => r.json());
      const tbody = document.getElementById("rtoTableBody");
      tbody.innerHTML = "";

      const rtoList = (res.orders || []).filter(o => String(o.status || "").toLowerCase().includes("rto") || String(o.status || "").toLowerCase().includes("fail"));
      if (rtoList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--muted);">No RTO records found.</td></tr>';
        return;
      }

      rtoList.forEach(o => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><code>${o.awb_number}</code></td>
          <td>${o.order_number}</td>
          <td><b>${o.shipping_name}</b></td>
          <td>${o.status}</td>
          <td><span class="rto-badge">RTO Logged</span></td>
        `;
        tbody.appendChild(tr);
      });
    } catch(err) {
      document.getElementById("rtoTableBody").innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:red;">Error: ${err.message}</td></tr>`;
    }
  }

  window.onload = loadRtoData;
</script>
</body>
</html>
