<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxd Not Picked - Supabase Powered</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; padding: 24px; color: #f8fafc; }
    .container { max-width: 1300px; margin: 0 auto; background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
    .badge { background: #ef4444; color: #fff; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
    
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="text"], select { background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 9px 14px; border-radius: 6px; font-size: 14px; outline: none; }
    input[type="text"]:focus, select:focus { border-color: #38bdf8; }
    
    button { background: #22c55e; color: #052e16; font-weight: 700; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 14px; }
    button:hover { background: #16a34a; color: #fff; }

    .table-responsive { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
    th { background: #0f172a; color: #94a3b8; font-weight: 600; padding: 12px 14px; border-bottom: 1px solid #334155; }
    td { padding: 14px; border-bottom: 1px solid #334155; }
    tr:hover { background: #263349; }

    .store-tag { background: #0284c7; color: #e0f2fe; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .awb-code { font-family: monospace; font-size: 13px; color: #38bdf8; font-weight: 600; }
    .status-pill { background: #854d0e; color: #fef08a; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .loader { text-align: center; padding: 40px; color: #94a3b8; font-size: 15px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>Not Picked Shipments <span id="countBadge" class="badge">0</span></h1>
      <p style="font-size: 13px; color: #94a3b8; margin-top: 4px;">Direct Boxd Logistics Sync via Supabase Edge Function</p>
    </div>
    <div class="controls">
      <select id="storeSelect" onchange="filterData()">
        <option value="">All Stores</option>
      </select>
      <input type="text" id="searchBox" placeholder="Search Order #, AWB, Customer..." onkeyup="filterData()" />
      <button onclick="fetchNotPicked()">↻ Refresh</button>
    </div>
  </div>

  <div id="loadingText" class="loader">Loading from Supabase...</div>

  <div class="table-responsive">
    <table id="dataTable" style="display: none;">
      <thead>
        <tr>
          <th>Order #</th>
          <th>Store</th>
          <th>AWB Number</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Pickup Warehouse</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // Apne Supabase Project ke credentials yahan daalein:
  const SUPABASE_FUNCTION_URL = "https://yyzvpjmejzbblunkyadp.supabase.co/functions/v1/bright-responder";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5enZwam1lanpiYmx1bmt5YWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTU5NjcsImV4cCI6MjEwMDc5MTk2N30.S5XXzQBQQp6bo0jGGe0KBxdGoSdjzGjRFUqjK3y8KCM";

  let ordersList = [];

  async function fetchNotPicked() {
    const loader = document.getElementById("loadingText");
    const table = document.getElementById("dataTable");
    loader.style.display = "block";
    loader.innerText = "Syncing live orders...";
    table.style.display = "none";

    try {
      const res = await fetch(SUPABASE_FUNCTION_URL, {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json"
        }
      });

      const data = await res.json();
      if (!data.success) {
        loader.innerText = "Error: " + (data.error || "Failed to load");
        return;
      }

      ordersList = data.orders || [];
      populateStores(ordersList);
      renderTable(ordersList);

      loader.style.display = "none";
      table.style.display = "table";
    } catch (e) {
      loader.innerText = "Fetch Error: " + e.message;
    }
  }

  function populateStores(orders) {
    const select = document.getElementById("storeSelect");
    const curr = select.value;
    const stores = [...new Set(orders.map(o => o.store_name).filter(Boolean))];
    
    select.innerHTML = '<option value="">All Stores</option>';
    stores.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.innerText = s;
      select.appendChild(opt);
    });
    select.value = curr;
  }

  function renderTable(orders) {
    const tbody = document.getElementById("tableBody");
    const badge = document.getElementById("countBadge");
    tbody.innerHTML = "";
    badge.innerText = orders.length;

    if (orders.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 25px; color:#64748b;">No pending pickups found.</td></tr>`;
      return;
    }

    orders.forEach(o => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>#${o.order_number || o.channel_order_id || "-"}</strong></td>
        <td><span class="store-tag">${o.store_name || "Shopify"}</span></td>
        <td>${o.awb_number ? `<span class="awb-code">\${o.awb_number}</span>` : '<span style="color:#64748b;">Pending AWB</span>'}</td>
        <td>${o.customer_name || "-"}</td>
        <td>${o.customer_phone_number ? `${o.customer_isd_code \vert{}\vert{} "+91"} ${o.customer_phone_number}` : "-"}</td>
        <td>${o.pickup_name || "-"}</td>
        <td><span class="status-pill">NOT PICKED</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filterData() {
    const query = document.getElementById("searchBox").value.toLowerCase();
    const store = document.getElementById("storeSelect").value;

    const filtered = ordersList.filter(o => {
      const matchStore = !store || o.store_name === store;
      const hay = [
        o.order_number,
        o.channel_order_id,
        o.awb_number,
        o.customer_name,
        o.customer_phone_number,
        o.pickup_name
      ].join(" ").toLowerCase();

      return matchStore && hay.includes(query);
    });

    renderTable(filtered);
  }

  window.onload = fetchNotPicked;
</script>

</body>
</html>
