<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Return Reconciliation - Harsidhi</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --primary: #2563eb; --primary-soft: #eff6ff; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body { background: var(--bg); display:flex; justify-content:center; }
    .viewport { width:100%; max-width:440px; min-height:100vh; background:var(--card); padding:20px; }
    .header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .back-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); }
    .upload-box { border:2px dashed var(--border); padding:24px; border-radius:16px; text-align:center; background:var(--bg); cursor:pointer; }
    .rec-item { padding:12px; border:1px solid var(--border); border-radius:12px; margin-top:10px; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; }
  </style>
</head>
<body>
<div class="viewport">
  <div class="header">
    <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i></a>
    <h2 style="font-size:18px; font-weight:800;">Return Reconciliation</h2>
  </div>

  <div class="upload-box" onclick="document.getElementById('csv-file').click()">
    <i data-lucide="file-spreadsheet" style="width:36px; height:36px; color:var(--primary); margin-bottom:8px;"></i>
    <div style="font-weight:700; font-size:14px;">Upload BOXD Returns CSV</div>
    <div style="font-size:11.5px; color:#64748b; margin-top:4px;">Click to select and auto-reconcile</div>
    <input type="file" id="csv-file" accept=".csv" style="display:none;" onchange="handleCsv(event)" />
  </div>

  <div style="font-size:15px; font-weight:700; margin:20px 0 10px;">Reconciliation Status</div>
  <div id="rec-results">Upload CSV to compare with Daily-Scan Sheet</div>
</div>

<script>
  lucide.createIcons();
  const API_URL = localStorage.getItem("GS_API_URL") || "";

  function handleCsv(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(evt) {
      const text = evt.target.result;
      const rows = text.split("\n").map(r => r.split(","));
      
      document.getElementById("rec-results").innerHTML = "Comparing with Daily-Scan Sheet...";
      
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "uploadBoxdCsv", payload: { rows } })
      });
      const data = await res.json();
      if(data.success) {
        fetchReport();
      }
    };
    reader.readAsText(file);
  }

  async function fetchReport() {
    const res = await fetch(`${API_URL}?action=getBoxdReturnReport`);
    const data = await res.json();
    if(data.success) {
      let html = `<div style="font-size:12px; margin-bottom:10px;"><b>Received:</b> ${data.received.length} | <b>Pending Scan:</b> ${data.pending.length}</div>`;
      html += data.pending.map(p => `
        <div class="rec-item">
          <div>
            <div style="font-weight:700; color:#ef4444;">#${p.customerOrderNumber}</div>
            <div style="font-size:11px; color:#64748b;">${p.customerName || 'Customer'} • ${p.city || ''}</div>
          </div>
          <span style="font-size:10px; font-weight:700; background:#fee2e2; color:#ef4444; padding:3px 8px; border-radius:10px;">${p.status}</span>
        </div>
      `).join("");
      document.getElementById("rec-results").innerHTML = html;
    }
  }
</script>
</body>
</html>
