<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Find Order - Harsidhi Ventures</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --primary: #2563eb; --primary-soft: #eff6ff; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body { background: var(--bg); display:flex; justify-content:center; }
    .viewport { width:100%; max-width:440px; min-height:100vh; background:var(--card); padding:20px; }
    .header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .back-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); }
    .search-box { width:100%; padding:14px; border-radius:12px; border:1.5px solid var(--border); font-size:14px; font-weight:600; outline:none; margin-bottom:12px; }
    .search-box:focus { border-color:var(--primary); }
    .btn { width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); color:#fff; font-weight:700; cursor:pointer; }
    .result-card { background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:18px; margin-top:20px; display:none; }
    .field { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px; }
    .field:last-child { border-bottom:none; }
    .label { color:#64748b; font-weight:600; }
    .val { font-weight:700; color:var(--text); }
  </style>
</head>
<body>
<div class="viewport">
  <div class="header">
    <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i></a>
    <h2 style="font-size:18px; font-weight:800;">Find Order Details</h2>
  </div>

  <input type="text" id="query" class="search-box" placeholder="Enter AWB or Order Number..." />
  <button class="btn" onclick="searchRecord()">Search in Google Sheet</button>

  <div id="result" class="result-card">
    <div style="font-size:15px; font-weight:800; color:var(--primary); margin-bottom:12px;" id="r-order">Order #</div>
    <div class="field"><span class="label">AWB</span><span class="val" id="r-awb">-</span></div>
    <div class="field"><span class="label">Customer</span><span class="val" id="r-cust">-</span></div>
    <div class="field"><span class="label">Status</span><span class="val" id="r-status" style="color:#2563eb;">-</span></div>
    <div class="field"><span class="label">Courier</span><span class="val" id="r-courier">-</span></div>
    <div class="field"><span class="label">City / State</span><span class="val" id="r-city">-</span></div>
    <div class="field"><span class="label">Type</span><span class="val" id="r-type">-</span></div>
    <div class="field"><span class="label">Date</span><span class="val" id="r-date">-</span></div>
  </div>
</div>

<script>
  lucide.createIcons();
  const API_URL = localStorage.getItem("GS_API_URL") || "";

  // Auto fill if search from home
  const urlParam = new URLSearchParams(window.location.search).get('q');
  if(urlParam) {
    document.getElementById("query").value = urlParam;
    searchRecord();
  }

  async function searchRecord() {
    const q = document.getElementById("query").value.trim();
    if (!q || !API_URL) return alert("Please enter AWB / Order ID and ensure API is configured.");

    const resCard = document.getElementById("result");
    resCard.style.display = "block";
    resCard.innerHTML = "<div style='text-align:center;color:#64748b;'>Searching records...</div>";

    try {
      const res = await fetch(`${API_URL}?action=searchOrder&keyword=${encodeURIComponent(q)}`);
      const data = await res.json();
      if(data.success) {
        resCard.innerHTML = `
          <div style="font-size:16px; font-weight:800; color:var(--primary); margin-bottom:12px;">Order #${data.orderId || 'N/A'}</div>
          <div class="field"><span class="label">AWB</span><span class="val">${data.awb}</span></div>
          <div class="field"><span class="label">Customer</span><span class="val">${data.customer || '-'}</span></div>
          <div class="field"><span class="label">Status</span><span class="val" style="color:#2563eb;">${data.status || 'Pending'}</span></div>
          <div class="field"><span class="label">Courier</span><span class="val">${data.courier || '-'}</span></div>
          <div class="field"><span class="label">Destination</span><span class="val">${data.city || ''} ${data.state || ''}</span></div>
          <div class="field"><span class="label">Type</span><span class="val">${data.type}</span></div>
          <div class="field"><span class="label">Scan Date</span><span class="val">${data.date}</span></div>
        `;
      } else {
        resCard.innerHTML = `<div style="text-align:center;color:#ef4444;font-weight:600;">Record not found!</div>`;
      }
    } catch(err) {
      resCard.innerHTML = `<div style="text-align:center;color:#ef4444;">API Error!</div>`;
    }
  }
</script>
</body>
</html>
