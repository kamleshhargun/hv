<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Reconciliation - Harsidhi ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f4f6fb; --card-bg: rgba(255, 255, 255, 0.92); --card-border: #e8ecf4; --text: #1e293b; --muted: #64748b; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .app-box { max-width: 1540px; margin: 0 auto; background: var(--card-bg); border-radius: 20px; border: 1.5px solid var(--card-border); padding: 22px; box-shadow: 0 10px 25px rgba(100,116,139,0.08); }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 1.5px solid var(--card-border); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .brand { font-size: 21px; font-weight: 800; color: #1e1b4b; }
    .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav-btn { background: #1e1b4b; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 700; }
    .table-viewport { overflow-x: auto; background: #ffffff; border-radius: 16px; border: 1.5px solid var(--card-border); margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    th { background: #f8fafc; color: #475569; padding: 12px 14px; font-size: 11px; font-weight: 800; text-transform: uppercase; border-bottom: 1.5px solid var(--card-border); }
    td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; color: var(--text); }
    .pay-badge { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 11px; }
    .pend-badge { background: #fee2e2; color: #b91c1c; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 11px; }
  </style>
</head>
<body>
<div class="app-box">
  <div class="header">
    <div class="brand">💳 Payment Reconciliation</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">Dashboard</a>
      <a href="order.html" class="nav-btn">Order Recon</a>
      <a href="rto.html" class="nav-btn">Return Recon</a>
      <a href="payment.html" class="nav-btn" style="background:#3b82f6;">Payment Recon</a>
    </div>
  </div>
  <p style="color:var(--muted); font-size:13px;">Verify COD remittances, Razorpay, and GoKwik gateway transactions seamlessly[cite: 3].</p>
  
  <div class="table-viewport">
    <table>
      <thead>
        <tr>
          <th>AWB Number</th>
          <th>Customer Name</th>
          <th>Gateway / Mode</th>
          <th>Transaction ID</th>
          <th>Amount Received</th>
          <th>Payment Status</th>
        </tr>
      </thead>
      <tbody id="payTableBody">
        <tr><td colspan="6" style="text-align:center; padding:20px; color:var(--muted);">Loading payment records...[cite: 3]</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzwsETqGw3qosnU2ag1MzUhVJbYusgL9LZAWhaSBOvyf_gr6U28laqQ09HMe02pZXuy/exec";

  async function loadPaymentData() {
    try {
      const res = await fetch(API_ENDPOINT + "?action=fetchStation").then(r => r.json());
      const tbody = document.getElementById("payTableBody");
      tbody.innerHTML = "";

      const savedList = res.saved_picked_orders || [];
      if (savedList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--muted);">No payment records found.</td></tr>';
        return;
      }

      savedList.forEach(s => {
        const isPaid = s.payment_status === "RECEIVED";
        const statusBadge = isPaid 
          ? `<span class="pay-badge">PAID: ₹${s.payment_received_amount}</span>` 
          : `<span class="pend-badge">PENDING: ₹${s.total_amount}</span>`;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><code>${s.awb_number}</code></td>
          <td><b>${s.customer_name}</b></td>
          <td>${s.gateway || s.payment_mode}</td>
          <td>${s.tx_id || '-'}</td>
          <td>₹${s.payment_received_amount || 0}</td>
          <td>${statusBadge}</td>
        `;
        tbody.appendChild(tr);
      });
    } catch(err) {
      document.getElementById("payTableBody").innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px; color:red;">Error: ${err.message}</td></tr>`;
    }
  }

  window.onload = loadPaymentData;
</script>
</body>
</html>
