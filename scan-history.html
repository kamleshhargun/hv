<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Scan History - Harsidhi</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --primary: #2563eb; --primary-soft: #eff6ff; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body { background: var(--bg); display:flex; justify-content:center; }
    .viewport { width:100%; max-width:440px; min-height:100vh; background:var(--card); padding:20px; }
    .header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .back-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); }
    .row-card { padding:12px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; font-size:12.5px; }
  </style>
</head>
<body>
<div class="viewport">
  <div class="header">
    <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i></a>
    <h2 style="font-size:18px; font-weight:800;">Scan Logs (Total)</h2>
  </div>
  <div id="history-container">Loading all scans from sheet...</div>
</div>

<script>
  lucide.createIcons();
  const API_URL = localStorage.getItem("GS_API_URL") || "";

  async function loadHistory() {
    if(!API_URL) return;
    const res = await fetch(`${API_URL}?action=getTotalRecords`);
    const data = await res.json();
    if(data.success) {
      document.getElementById("history-container").innerHTML = data.rows.map(r => `
        <div class="row-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <span style="font-weight:800; color:var(--primary);">${r.awb}</span>
            <span style="font-size:10px; font-weight:700; padding:2px 6px; border-radius:8px; background:${r.type==='Pickup'?'#eff6ff':'#fee2e2'}; color:${r.type==='Pickup'?'#2563eb':'#ef4444'};">${r.type}</span>
          </div>
          <div style="color:#64748b; font-size:11.5px;">Order: ${r.orderId || 'N/A'} • Status: ${r.status || 'Pending'}</div>
          <div style="color:#94a3b8; font-size:10.5px; margin-top:4px;">Date: ${r.date} ${r.updatedAt ? '| ' + r.updatedAt : ''}</div>
        </div>
      `).join("");
    }
  }
  loadHistory();
</script>
</body>
</html>
