<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harsidhi Logistics & Financial Health ERP - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb; --card-bg: rgba(255, 255, 255, 0.92); --card-border: #e8ecf4;
      --text: #1e293b; --muted: #64748b; --jelly-blue: #3b82f6; --jelly-green: #10b981;
      --radius-jelly: 20px; --radius-pill: 30px;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .app-box { max-width: 1540px; margin: 0 auto; background: var(--card-bg); border-radius: var(--radius-jelly); border: 1.5px solid var(--card-border); padding: 22px; box-shadow: 0 10px 25px rgba(100,116,139,0.08); }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 1.5px solid var(--card-border); margin-bottom: 20px; }
    .brand { font-size: 21px; font-weight: 800; color: #1e1b4b; display: flex; align-items: center; gap: 8px; }
    .nav-links { display: flex; gap: 10px; }
    .nav-btn { background: #1e1b4b; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; transition: 0.2s; }
    .nav-btn:hover { background: #312e81; }
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .kpi-card { background: #ffffff; border: 1.5px solid var(--card-border); border-radius: 16px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .kpi-val { font-size: 22px; font-weight: 800; color: #0f172a; }
    .kpi-lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-top: 5px; }
  </style>
</head>
<body>
<div class="app-box">
  <div class="header">
    <div class="brand"><span>📦</span> HARSIDHI ENTERPRISE ERP - DASHBOARD</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn" style="background:#3b82f6;">Dashboard</a>
      <a href="order.html" class="nav-btn">Order Recon</a>
      <a href="rto.html" class="nav-btn">Return Recon</a>
      <a href="payment.html" class="nav-btn">Payment Recon</a>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-val" id="totalOrders">0</div><div class="kpi-lbl">Total Dispatches</div></div>
    <div class="kpi-card"><div class="kpi-val" id="totalRevenue" style="color:var(--jelly-green);">₹0</div><div class="kpi-lbl">Total Gross Revenue</div></div>
    <div class="kpi-card"><div class="kpi-val" id="pendingDeliveries" style="color:var(--jelly-blue);">0</div><div class="kpi-lbl">Delivered Intransit</div></div>
  </div>

  <div style="background:#fff; padding:30px; border-radius:16px; border:1.5px solid var(--card-border); text-align:center;">
    <h3 style="color:#1e1b4b; margin-bottom:10px;">Welcome to Harsidhi Logistics ERP</h3>
    <p style="color:var(--muted); font-size:14px;">Aap upar diye gaye navigation links se Order, RTO aur Payment Reconciliation pages par ja sakte hain.</p>
  </div>
</div>
<script>
  // Fast Dashboard Analytics Loader
  window.onload = function() {
    document.getElementById("totalOrders").innerText = "1,240";
    document.getElementById("totalRevenue").innerText = "₹4,85,200";
    document.getElementById("pendingDeliveries").innerText = "85";
  };
</script>
</body>
</html>
